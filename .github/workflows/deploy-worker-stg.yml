name: Deploy task queue worker to staging

concurrency:
  group: staging-task-queue-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/deploy-worker-prd.yml"
      - "config/deploy-worker.yml"
      - "Dockerfile.task-queue"
      - ".kamal/secrets"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "prisma.config.ts"
      - "prisma/schema.prisma"
      - "scripts/process-task-queue.ts"
      - "app/assets/data/publishing-status.json"
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    environment: stg

    env:
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_LOGIN_SERVER: ${{ secrets.KAMAL_REGISTRY_LOGIN_SERVER }}
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      KAMAL_WORKER_SERVER_IP: ${{ secrets.KAMAL_WORKER_SERVER_IP }}
      KAMAL_WORKER_APP_NAME: ${{ secrets.KAMAL_WORKER_APP_NAME }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AZURE_DRAFT_ACCOUNT_KEY: ${{ secrets.AZURE_DRAFT_ACCOUNT_KEY }}
      AZURE_DRAFT_CONNECTION_STRING: ${{ secrets.AZURE_DRAFT_CONNECTION_STRING }}
      AZURE_PUBLISHED_CONNECTION_STRING: ${{ secrets.AZURE_PUBLISHED_CONNECTION_STRING }}
      SSH_PRIVATE_KEY_WORKER: ${{secrets.SSH_PRIVATE_KEY_WORKER}}
      AZURE_PUBLISHED_ACCOUNT_KEY: ${{secrets.AZURE_PUBLISHED_ACCOUNT_KEY}}


    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.3
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal

      - name: Configure SSH access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_WORKER }}

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.KAMAL_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Check Kamal version
        run: kamal version

      - name: Deploy worker
        run: kamal setup --config-file config/deploy-worker.yml